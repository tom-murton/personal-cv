<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0d0e12">
<title>Page not found — Tom Murton</title>
<link rel="icon" href="/favicon.png" type="image/png">
<style>
@font-face{font-family:"Bricolage Grotesque";src:url("/stage/fonts/bricolage-grotesque-latin-opsz-normal.woff2") format("woff2");font-weight:200 800;font-display:swap}
@font-face{font-family:"Atkinson Hyperlegible Mono";src:url("/stage/fonts/ahm-latin-wght-normal.woff2") format("woff2");font-weight:200 800;font-display:swap}
:root{color-scheme:dark;--bg:#0d0e12;--fg:#f3f4f0;--dim:#9ca6a8;--accent:#b8e7f0;--line:rgba(243,244,240,.18);--pad:clamp(1rem,3.4vw,3rem);--mono:"Atkinson Hyperlegible Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:400 1.0625rem/1.5 "Bricolage Grotesque",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-underline-offset:.2em;text-decoration-thickness:1px}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
header{display:flex;justify-content:space-between;align-items:baseline;padding:1.1rem var(--pad);border-bottom:1px solid var(--line)}
.name{font-weight:600;font-size:1.05rem;letter-spacing:-.02em;text-decoration:none}
.name span,.eyebrow{display:block;font:500 .64rem/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:.15rem}
.eyebrow{font-size:.74rem;letter-spacing:.07em}
main{position:relative;flex:1;display:flex;align-items:flex-end;padding:clamp(2rem,6vw,4.5rem) var(--pad);overflow:hidden}
svg{position:absolute;right:-6vw;top:50%;width:min(80vw,46rem);transform:translateY(-55%);z-index:0}
section{position:relative;z-index:1;max-width:52rem}
h1{margin:.9rem 0 0;font-weight:500;font-size:clamp(2.8rem,9vw,7rem);line-height:.9;letter-spacing:-.055em}
p{margin:1.2rem 0 0;max-width:34em;opacity:.9}
nav{display:flex;flex-wrap:wrap;gap:.8rem 1.6rem;margin-top:1.8rem;font-weight:500;align-items:center}
.primary{padding:.8rem 1rem;background:var(--accent);color:#0d0e12;text-decoration:none}
@media (max-width:46rem){svg{right:-30vw;top:34%;width:120vw}}
</style>
</head>
<body>
<header><a class="name" href="/">Tom Murton <span>Makes things</span></a></header>
<main>
  <svg viewBox="0 0 800 800" aria-hidden="true"><g fill="none" stroke="#f3f4f0" stroke-opacity=".16"><circle cx="400" cy="400" r="110"/><circle cx="400" cy="400" r="200"/><circle cx="400" cy="400" r="290"/><circle cx="400" cy="400" r="380"/></g><circle cx="400" cy="400" r="70" fill="#b8e7f0" fill-opacity=".05"/><circle cx="400" cy="200" r="33" fill="#b8e7f0"/></svg>
  <section aria-labelledby="not-found-title">
    <p class="eyebrow">404 / Not in the collection</p>
    <h1 id="not-found-title">Nothing lives at this address.</h1>
    <p>The link may be out of date, or the page may have moved. Browse the current projects or return to the homepage.</p>
    <nav aria-label="Page recovery"><a class="primary" href="/projects">Browse projects →</a><a href="/">Return home</a></nav>
  </section>
</main>
</body>
</html>
