<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#0d0e12" />
    <title>Page not found — Tom Murton</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      :root { color-scheme: dark; --bg: #0d0e12; --fg: #f2f3ef; --muted: #8d9798; --accent: #a9dfea; --line: #2a2c30; }
      * { box-sizing: border-box; }
      body { min-width: 320px; min-height: 100vh; margin: 0; overflow-x: hidden; background: var(--bg); color: var(--fg); font-family: "Bricolage Grotesque", sans-serif; }
      a { color: inherit; text-decoration: none; }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
      header { display: flex; min-height: 94px; align-items: center; justify-content: space-between; padding: 0 clamp(24px, 5vw, 72px); border-bottom: 1px solid var(--line); }
      .brand { display: flex; flex-direction: column; font-size: 17px; font-weight: 600; line-height: 1.05; letter-spacing: -.025em; }
      .brand small, .eyebrow { margin-top: 4px; color: var(--muted); font: 500 10px/1.25 "IBM Plex Mono", monospace; letter-spacing: .14em; text-transform: uppercase; }
      header nav { display: flex; gap: clamp(18px, 2.5vw, 38px); font-size: 14px; font-weight: 500; }
      main { position: relative; display: flex; min-height: max(650px, calc(100svh - 94px)); align-items: flex-end; overflow: hidden; padding: clamp(90px, 11vw, 160px) clamp(24px, 6vw, 90px); border-bottom: 1px solid var(--line); isolation: isolate; }
      .code { position: absolute; z-index: -2; top: 50%; right: -.08em; color: rgba(169,223,234,.06); font: 500 clamp(250px, 43vw, 700px)/.7 "Bricolage Grotesque", sans-serif; letter-spacing: -.14em; transform: translateY(-50%); -webkit-text-stroke: 1px rgba(169,223,234,.25); }
      section { position: relative; z-index: 1; max-width: 850px; }
      h1 { max-width: 820px; margin: 34px 0 0; font: 500 clamp(64px, 8.6vw, 132px)/.84 "Bricolage Grotesque", sans-serif; letter-spacing: -.07em; }
      section > p:not(.eyebrow) { max-width: 560px; margin: 38px 0 0; color: #b5bdbe; font-size: clamp(16px, 1.4vw, 20px); line-height: 1.5; }
      .actions { display: flex; align-items: center; gap: 28px; margin-top: 42px; }
      .primary, .secondary { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; }
      .primary { padding: 14px 18px; background: var(--accent); color: #071013; }
      .secondary { padding-bottom: 4px; border-bottom: 1px solid currentColor; }
      @media (max-width: 760px) {
        header { min-height: 76px; }
        header nav { display: none; }
        main { min-height: max(620px, calc(100svh - 76px)); }
        .code { top: 32%; right: -.12em; font-size: clamp(220px, 69vw, 410px); }
        h1 { font-size: clamp(58px, 15vw, 90px); overflow-wrap: anywhere; }
      }
      @media (max-width: 430px) { .actions { align-items: flex-start; flex-direction: column; gap: 22px; } }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="/" aria-label="Tom Murton, home"><span>Tom Murton</span><small>Makes things</small></a>
      <nav aria-label="Primary navigation">
        <a href="/projects">Projects</a>
        <a href="/writing">Writing</a>
        <a href="/talks">Talks</a>
        <a href="/cv">CV</a>
      </nav>
    </header>
    <main>
      <div class="code" aria-hidden="true">404</div>
      <section aria-labelledby="not-found-title">
        <p class="eyebrow">404 / Not in the collection</p>
        <h1 id="not-found-title">Nothing lives at this address.</h1>
        <p>The link may be out of date, or the page may have moved. Browse the current projects or return to the homepage.</p>
        <nav class="actions" aria-label="Page recovery">
          <a class="primary" href="/projects">Browse projects <span aria-hidden="true">→</span></a>
          <a class="secondary" href="/">Return home</a>
        </nav>
      </section>
    </main>
  </body>
</html>
